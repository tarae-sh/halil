[package]
name = "halil"
version = "0.4.2"
edition = "2024"
rust-version = "1.88"
description = "A small task manager for the terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tarae-sh/halil"
readme = "README.md"
keywords = ["todo", "tasks", "cli", "tui"]
categories = ["command-line-utilities"]
# The README's picture is linked by its URL: the crate needn't carry it.
exclude = ["docs/", "NOTES.md"]

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
